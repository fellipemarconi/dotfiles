icons_format = "{icon}"

[theme]
theme = "ctp-mocha"
[theme.overrides]
separator = ""
idle_bg = "#cba6f7"
idle_fg = "#1e1e2e"

[icons]
icons = "awesome4"

[[block]]
block = "music"
format = " $icon { $artist - $title | $title | } "

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d/%m %R') "
