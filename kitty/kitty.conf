###############################################
# FONTES
###############################################
font_family JetBrainsMono Nerd Font
font_size 11

# Espaçamento vertical (opcional — deixa mais agradável)
adjust_line_height 2

###############################################
# CORES (Catppuccin Mocha - mais roxo)
###############################################

foreground              #cdd6f4
background              #0e0e0e
selection_foreground    #1e1e2e
selection_background    #585b70

# Cursor
cursor                  #f5e0dc
cursor_text_color       #1e1e2e

# Borders
active_border_color     #cba6f7
inactive_border_color   #6c7086

# Tabs
active_tab_foreground   #1e1e2e
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825

# Normal
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #cba6f7
color6  #94e2d5
color7  #bac2de

# Bright
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #a6adc8

###############################################
# CURSOR
###############################################
cursor_shape block

###############################################
# JANELA
###############################################
background_opacity 0.95

# Padding
window_padding_width 6

# Suavizar bordas do terminal
window_border_width 0
inactive_text_alpha 1.0

###############################################
# SHELL PADRÃO
###############################################
shell /usr/bin/fish

###############################################
# COMPORTAMENTO E MELHORIAS
###############################################

# Usar Wayland nativo
wayland_titlebar_color system

# Renderização mais rápida
repaint_delay 7
input_delay 2
sync_to_monitor yes

# Suporte a ligatures (JetBrainsMono tem)
enable_ligatures always

# Scroll mais suave
wheel_scroll_multiplier 3.0

# Melhor seleção
select_by_word_characters :@-./_~?&=%+#

###############################################
# ATALHOS ÚTEIS (opcionais)
###############################################

# Abrir nova aba
map ctrl+shift+t new_tab

# Fechar aba
map ctrl+shift+w close_tab

# Dividir horizontal
map ctrl+shift+right launch --location=hsplit

# Dividir vertical
map ctrl+shift+down launch --location=vsplit

# Copiar e colar estilo "moderno"
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

###############################################
# CONFIG EXTRA (BONUS)
###############################################

# Título da janela mostrando shell + diretório
window_title_format "{title} — {cwd}"

# Fazer o kitty abrir mais rápido ainda
initial_window_width 900
initial_window_height 600

